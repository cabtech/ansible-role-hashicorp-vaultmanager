---

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-vaultmanager"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-vaultmanager"]

- name: 'Initialise Vault (solo)'
  ansible.builtin.command: /usr/local/bin/init-vault.sh
  when:
  - vault_role == 'server'
  - "'vault_solo' in group_names"
  register: reg_vault_init
  changed_when:
  - reg_vault_init.rc != 99
  failed_when:
  - reg_vault_init.rc != 0
  - reg_vault_init.rc != 99
  become: true
  tags: ["ct-vaultmanager"]

- name: 'Fetch files from primary (1/2)'
  ansible.builtin.fetch:
    dest: /var/tmp/vault-keys
    flat: true
    src: /var/tmp/vault/keys
  when:
  - vault_role == 'server'
  - "'vault_solo' in group_names"
  become: true
  tags: ["ct-vaultmanager"]

- name: 'Fetch files from primary (2/2)'
  ansible.builtin.fetch:
    dest: /var/tmp/vault-token
    flat: true
    src: /var/tmp/vault/token
  when:
  - vault_role == 'server'
  - "'vault_solo' in group_names"
  become: true
  tags: ["ct-vaultmanager"]

- name: 'Push files to secondaries'
  ansible.builtin.copy:
    dest: /var/tmp/vault/keys
    group: root
    mode: '0600'
    owner: root
    src: /var/tmp/vault-keys
  no_log: true
  when:
  - vault_role == 'server'
  - "'vault_solo' not in group_names"
  become: true
  tags: ["ct-vaultmanager"]

- name: 'Unseal the Vault'
  ansible.builtin.command: /usr/local/bin/unseal-vault.sh
  when: vault_role == 'server'
  register: reg_vault_unseal
  become: true
  changed_when: reg_vault_unseal.rc != 99
  failed_when:
  - reg_vault_unseal.rc != 0
  - reg_vault_unseal.rc != 99
  tags: ["ct-vaultmanager"]

- name: 'Prepare the Vault (solo)'
  ansible.builtin.command: /usr/local/bin/prepare-vault.sh
  when:
  - vault_role == 'server'
  - "'vault_solo' not in group_names"
  register: reg_vault_prepare
  become: true
  changed_when: reg_vault_prepare.rc != 99
  failed_when:
  - reg_vault_prepare.rc != 0
  - reg_vault_prepare.rc != 99
  tags: ["ct-vaultmanager"]

- name: 'Fetch Nomad file (solo)'
  ansible.builtin.fetch:
    dest: vars-pri-nomad.yml
    flat: true
    src: /var/tmp/vault/vars-pri-nomad.yml
  when:
  - vault_role == 'server'
  - "'vault_solo' in group_names"
  become: true
  tags: ["ct-vaultmanager"]

- name: 'Clean up temp files'
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: ['/var/tmp/vault/keys', '/var/tmp/vault/token']
  become: true
  when:
  - vault_role == 'server'
  - "'vault_solo' not in group_names"
  tags: ["ct-vaultmanager"]

